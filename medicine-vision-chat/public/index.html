<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>药物小帮手</title><style>body{margin:0;background:#08111f;color:#fff;font:20px Arial,"Microsoft YaHei",sans-serif}main{max-width:900px;margin:auto;padding:24px}.card{background:#12233a;border-radius:20px;padding:22px;margin:18px 0}h1{font-size:38px}p{color:#c7d5e5}button,input{font:inherit;padding:14px;border-radius:12px;margin:6px 0}button{cursor:pointer;background:#55d6be;border:0;color:#06201d;font-weight:bold}input{width:90%;background:#0b1728;color:#fff;border:1px solid #567}video,canvas{width:48%;min-height:220px;background:#000;border-radius:14px;object-fit:cover}.row{display:flex;gap:15px;flex-wrap:wrap}.result{line-height:1.8;color:#dff}@media(max-width:650px){video,canvas{width:100%}}</style></head><body><main><h1>药物小帮手</h1><p>实时视频识别医嘱、寻找目标药物、核对药名并检查有效期</p><section class="card"><label>我想找的药物：</label><input id="instruction" placeholder="例如：帮我找阿莫西林"><br><button id="speak">🎙️ 语音输入</button> <button id="stop">停止聆听</button></section><section class="card"><div class="row"><video id="video" autoplay playsinline></video><canvas id="canvas"></canvas></div><button id="camera">开启实时摄像头</button><p>把药盒放在镜头前，我会每秒分析并在需要时提示翻转药盒或靠近一些。</p></section><section class="card result" id="result">准备好后开启摄像头。</section></main><script>const $=x=>document.getElementById(x),v=$('video'),c=$('canvas'),out=$('result');let stream,last='',timer;function say(t){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}async function scan(){if(!v.videoWidth)return;c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(async b=>{let f=new FormData;f.append('image',b,'live.jpg');f.append('instruction',$('instruction').value);try{let d=await(await fetch('/api/analyze',{method:'POST',body:f})).json(); d=normalize(d); if(d.medicine&&d.medicine!==last){last=d.medicine;out.innerHTML='<b>'+d.medicine+'</b><br>'+(d.summary||'')+'<br>有效期：'+(d.expiry||'未识别')+'<br>'+(d.advice||'');say(d.advice||('已识别'+d.medicine))} else if(!d.medicine){say(guide[gi++%guide.length])}}catch(e){}},'image/jpeg',.75)}$('camera').onclick=async()=>{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;say('摄像头已开启，请把药盒放在镜头前');if(!timer)timer=setInterval(scan,1000)};let rec;$('speak').onclick=()=>{let C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C){out.textContent='当前浏览器不支持语音输入，请使用文字输入。';return}rec=new C;rec.lang='zh-CN';rec.onresult=e=>$('instruction').value=e.results[0][0].transcript;rec.start()};$('stop').onclick=()=>rec&&rec.stop();</script></body></html>
