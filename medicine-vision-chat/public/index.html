<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鑽墿灏忓府鎵?/title><style>
:root{--bg:#08111f;--card:#101d31;--text:#f7fbff;--muted:#b8c8dc;--accent:#55d6be;--warn:#ffd166;--danger:#ff8a8a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#08111f,#10233b);color:var(--text);font:20px system-ui,"Microsoft Yahei",sans-serif}main{max-width:900px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px}.hero h1{font-size:36px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}.badge{background:#173b4b;color:var(--accent);padding:10px 14px;border-radius:99px;font-size:16px}.card{background:rgba(16,29,49,.95);border:1px solid #27415f;border-radius:22px;padding:22px;margin-top:20px;box-shadow:0 10px 30px #0003}label{display:block;color:var(--muted);margin-bottom:8px}input,button{font:inherit;border-radius:14px;border:1px solid #45617d;padding:14px;background:#0d192a;color:var(--text)}input{width:100%}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}button{cursor:pointer;background:#173451}button.primary{background:var(--accent);color:#06201d;border:0;font-weight:700}button:focus,input:focus{outline:3px solid var(--warn);outline-offset:2px}.video-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}video,canvas{width:100%;border-radius:16px;background:#000;min-height:220px;object-fit:cover}.result{font-size:21px;line-height:1.7}.ok{color:var(--accent)}.warn{color:var(--warn)}.danger{color:var(--danger)}.small{font-size:16px;color:var(--muted)}@media(max-width:650px){.video-wrap{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><main><div class="hero"><div><h1>鑽墿灏忓府鎵?/h1><p>鐢ㄦ憚鍍忓ご璇诲尰鍢便€佹壘鑽苟妫€鏌ユ湁鏁堟湡</p></div><span class="badge">浣庤鍔涘弸濂?/span></div>
<section class="card"><label for="instruction">鎴戞兂鎵剧殑鑽墿锛堝彲鐩存帴璇磋瘽锛?/label><input id="instruction" placeholder="渚嬪锛氬府鎴戞壘闃胯帿瑗挎灄锛屾瘡娆′竴绮?><div class="actions"><button id="speak">馃帣锔?璇煶杈撳叆</button><button id="stop" disabled>鍋滄鑱嗗惉</button><span id="heard" class="small" aria-live="polite"></span></div></section>
<section class="card"><div class="video-wrap"><div><label>瀹炴椂鐢婚潰</label><video id="video" autoplay playsinline></video></div><div><label>鎷嶆憚棰勮</label><canvas id="canvas"></canvas></div></div><div class="actions"><button id="camera">寮€鍚憚鍍忓ご</button><button class="primary" id="analyze">馃摲 璇嗗埆褰撳墠鑽洅</button><input id="file" type="file" accept="image/*" capture="environment" hidden></div><p class="small">璇锋妸鑽洅姝ｉ潰鏀惧湪鐢婚潰涓ぎ锛岀‘淇濊嵂鍚嶅拰鏈夋晥鏈熸竻鏅板彲瑙併€?/p></section>
<section class="card result" id="result" aria-live="polite">鍑嗗濂藉悗锛屾寜鈥滆瘑鍒綋鍓嶈嵂鐩掆€濄€?/section></main><script>
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),result=$('result');let stream=null;
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
$('camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;say('鎽勫儚澶村凡寮€鍚紝璇峰皢鑽洅鏀惧湪鐢婚潰涓ぎ')}catch(e){say('鏃犳硶寮€鍚憚鍍忓ご锛岃妫€鏌ユ祻瑙堝櫒鏉冮檺')}};
$('file').onchange=()=>run($('file').files[0]); $('analyze').onclick=()=>{if(video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.toBlob(run,'image/jpeg',.9)}else $('file').click()};
async function run(blob){if(!blob)return;result.textContent='姝ｅ湪璇嗗埆锛岃绋嶅€欌€?;const fd=new FormData();fd.append('image',blob,'medicine.jpg');fd.append('instruction',$('instruction').value);try{const r=await fetch('/api/analyze',{method:'POST',body:fd});const d=await r.json();if(d.error)throw Error(d.error);const match=d.match?'鍖归厤':'涓嶅尮閰?;const exp=d.expiry||'鏈瘑鍒?;result.innerHTML=`<strong>${d.medicine||'鏈瘑鍒嵂鐗?}</strong><br>${d.summary||''}<br><span class="${d.match?'ok':'danger'}">${match}浣犵殑鐩爣</span><br><span class="${exp==='鏈瘑鍒??'warn':'ok'}">鏈夋晥鏈燂細${exp}</span><br><span class="small">缃俊搴︼細${Math.round((d.confidence||0)*100)}%銆€${d.advice||''}</span>`;say(`${d.medicine||'鑽墿'}锛?{match}浣犵殑鐩爣锛屾湁鏁堟湡${exp}`)}catch(e){result.textContent='璇嗗埆澶辫触锛?+e.message;say('璇嗗埆澶辫触锛岃閲嶆柊鎷嶆憚')}};
let rec; $('speak').onclick=()=>{const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C){say('褰撳墠娴忚鍣ㄤ笉鏀寔璇煶杈撳叆');return}rec=new C();rec.lang='zh-CN';rec.onresult=e=>{$('instruction').value=e.results[0][0].transcript;$('heard').textContent='宸插惉鍒帮細'+$('instruction').value};rec.onend=()=>{$('stop').disabled=true};rec.start();$('stop').disabled=false};$('stop').onclick=()=>rec&&rec.stop();
</script></body></html>
<script>
// Continuous assistant loop: samples the live video and speaks contextual guidance.
let live=false, lastMedicine='';
const guide=['璇锋妸鑽洅姝ｉ潰鏈濆悜闀滃ご銆?,'璇峰啀闈犺繎涓€鐐癸紝璁╄嵂鍚嶆竻鏅板彲瑙併€?,'璇锋參鎱㈢炕杞嵂鐩掞紝鎴戣璇诲彇鑳岄潰鐨勬湁鏁堟湡銆?]; let gi=0;
async function continuous(){ if(!live||!video.videoWidth)return; canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0); canvas.toBlob(async b=>{const fd=new FormData();fd.append('image',b,'live.jpg');fd.append('instruction',$('instruction').value);try{const d=await (await fetch('/api/analyze',{method:'POST',body:fd})).json(); if(d.medicine&&d.medicine!==lastMedicine){lastMedicine=d.medicine; result.innerHTML='<strong>'+d.medicine+'</strong><br>'+ (d.summary||'')+'<br>'+(d.advice||''); say(d.advice||('宸茶瘑鍒?+d.medicine));} else if(!d.medicine){say(guide[gi++%guide.length]);}}catch(e){}},'image/jpeg',.75);}
const oldCamera=$('camera').onclick; $('camera').onclick=async()=>{await oldCamera(); if(stream){live=true; say('瀹炴椂璇嗗埆宸插紑鍚紝鎴戜細杈圭湅杈规彁绀?); setInterval(continuous,1000);}};
</script>
